

@if(loading){
  <div style=" width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;">
    <mat-spinner></mat-spinner>
  </div>
}@else{
  <div >
    @for(message of messages; track message._id; let i = $index){
      <div style="width: 100%; display: flex; flex-direction: column; justify-content: center; margin-top: 20px;  align-items: center; ">
    
        <div style="  box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1); width: 70%; margin-top: 10px; display: flex; background-color: #ffff; border-radius: 10px;">
          <div style=" height: 180px; width: 90%; display: flex;">
            <div style="width: 100%; ">
          <form #editTaskForm="ngForm" style="margin: 10px;">
            <div>
            <label for="">Title:</label><br>
            <input  name="title" readonly  [(ngModel)]='message.title' type="text" style="padding-left: 10px; border-radius: 2px; margin-left: 5px; width: 100%; height: 40px; font-size: 18px; border: none; outline: none; background-color:#4070f4; color: white;" >
        
            <br><br>
        
            <label for="">Message:</label><br>
        
            <input  name="description" readonly [(ngModel)]='message.message' type="text" style="padding-left: 10px; border-radius: 2px; margin-left: 5px; width: 100%; font-size: 18px; border: none; outline: none; background-color: #4070f4; color: white; height: 40px;">
      
           </div>
           
          </form></div>
          </div>
          <div style="height: 180px; display: flex; align-items: center; justify-content: center; flex-direction: column;" >
            <button mat-raised-button style="color: #ffff; background-color: red; ">{{ message?.user?.username || "[Deleted User]"}}</button><br>
      
        
          </div>
        
        </div>
        
        
        
        </div> 
    }

    
    </div>
}
