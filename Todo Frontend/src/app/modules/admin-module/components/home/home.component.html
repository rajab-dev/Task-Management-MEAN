

<style>
  table {
    font-family: arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
    background-color: white;
  }
  
  td, th {
    /* border: 1px solid #dddddd; */
    text-align: left;
    padding: 8px;
  }
  
  tr:nth-child(even) {
    background-color: #dddddd;
  }

  .select{
     border: none;
     outline: none;
     box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
  }
  </style>


      @if(loading){
        <div style=" width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;">
          <mat-spinner></mat-spinner>
        </div>
      }@else{
        <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center;">
          <div style="width: 70%; box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);">
          <table>
            <tr>
              <th>User</th>
              <th>Tasks</th>
              <th>Completed</th>
              <th>Remaining</th>
              <th>Role</th>
              <th>Delete</th>
            </tr>
        
            @for(user of users; track user._id; let i = $index){
              <tr>
                <td>{{user.username}}</td>
                <td>{{user.tasks.length}}</td>
                <td>{{totalTaskCompleted[i]}}</td>
                <td>{{ user.tasks?.length -  totalTaskCompleted[i] }}</td>
                <td>
                  <select class="select" #selectRole (change)="handleChangeRole(selectRole.value, user._id )" >
                    <option  [selected]="true" [value]="user?.role">{{user.role}}</option>
                    <option  [value]="user.role==='admin' ? 'user' : 'admin' ">{{user.role ==="admin" ? "user" : "admin"}}</option>
                  </select>
          
                  
                </td>
                <td>
                  <button (click)="handleDeleteUser(user._id)" mat-raised-button style="color: #ffff; background-color: red; ">Delete User</button>
                </td>
          
              </tr>
            }

        
          </table>
          </div>
        </div>
      }
