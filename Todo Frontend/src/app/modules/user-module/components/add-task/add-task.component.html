<div class="task-container" >

  <div #taskCard class="task-card">
    <div class="task-content" style="background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); border-radius: 10px; padding: 10px;">
      <div class="task-header">
        <input style="background-color: transparent; border: none; color: inherit;" name="title" readonly [(ngModel)]='task.title' type="text" class="task-title">

        <button class="options-btn"
          (click)="isOPtionsOpen && specificTaskID == task._id ? slideOut(actionPanel) : slideIn(actionPanel, task._id)">
          <mat-icon>more_vertical</mat-icon>
        </button>
      </div>

      <div  style="background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);">
        <div (click)="togglePanel(task._id)" class="panel-header">
          <span style="width: 80%;" class="span-title">{{ task.title }}</span>
          <mat-icon (click)="copyToClipboard($event, task.description)" *ngIf="expandedTaskId == task._id" style="color: rgb(171, 170, 170);">content_copy</mat-icon>
          <span class="span-title">{{ expandedTaskId === task._id ? '🔼' : '🔽' }}</span>
        </div>

        <div *ngIf="expandedTaskId === task._id" class="panel-body" >
          <div #description name="description" readonly class="description-text">
            {{ task.description }}
          </div>
        </div>
      </div>
    </div>

    <div style="background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); border-radius: 10px; padding: 10px;" #actionPanel [style.display]="specificTaskID===task._id ? 'flex' : 'none'" class="action-panel">
      <mat-checkbox (click)="handleUpdate(task._id)" [checked]="task.isCompleted">✔ Done</mat-checkbox>

      <button appCustomDialogForm [dialogId]="task._id" [fields]="getDefaultValues(task)" [dialogTitle]="'Edit Task'"
        [dialogType]="'EDIT_USER_TASK'" [dialogIcon]="'edit'" (formSubmit)="onFormSubmit($event, actionPanel)"
        class="edit-btn">
        ✏ Edit
      </button>

      <button mat-raised-button appDialog [dialogId]="task._id" [dialogType]="'USER_DELETE_TASK'"
